.metric,.card{position:relative;border-radius:18px;border-color:color-mix(in srgb,var(--line),transparent 6%);background:linear-gradient(145deg,color-mix(in srgb,var(--paper),#fff 2%),var(--paper));box-shadow:0 12px 34px #02050b2b,inset 0 1px #ffffff0a;transition:transform .24s,border-color .24s,box-shadow .24s;overflow:hidden}.metric:before,.card:before{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent2),transparent 15%),color-mix(in srgb,var(--teal),transparent 32%),transparent);opacity:.5;pointer-events:none}.metric:hover,.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent2),var(--line) 52%);box-shadow:0 18px 44px #02050b45,0 0 22px color-mix(in srgb,var(--accent),transparent 93%),inset 0 1px #ffffff12}.metric{padding:18px;min-height:124px}.metric strong{font-size:29px}.metric-icon{border:1px solid color-mix(in srgb,var(--accent),transparent 82%);background:linear-gradient(145deg,color-mix(in srgb,var(--accent),transparent 84%),color-mix(in srgb,var(--teal),transparent 92%));box-shadow:inset 0 1px #ffffff10}.card{padding:19px}.card-head h2{font-size:15px;letter-spacing:-.025em}.list-row{transition:background .18s,border-radius .18s}.list-row:hover{background:color-mix(in srgb,var(--accent),transparent 96%);border-radius:10px}.status{box-shadow:inset 0 1px #ffffff15}.search,.filter,.field input,.field select,.field textarea{border-color:var(--line);background:color-mix(in srgb,var(--paper2),transparent 3%);transition:border-color .2s,box-shadow .2s}.search:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 85%);outline:0}.tab.active{color:var(--accent2)}.bar{box-shadow:0 0 18px color-mix(in srgb,var(--accent),transparent 70%)}.notice{backdrop-filter:blur(10px);border-color:color-mix(in srgb,var(--blue),transparent 72%);box-shadow:inset 0 1px #ffffff0c}.setup-step{background:color-mix(in srgb,var(--paper),transparent 12%);transition:border-color .2s,transform .2s}.setup-step:hover{border-color:color-mix(in srgb,var(--accent),var(--line) 40%);transform:translateX(3px)}.action-box{border:1px solid color-mix(in srgb,var(--line),transparent 38%);background:linear-gradient(120deg,color-mix(in srgb,var(--paper2),transparent 0%),color-mix(in srgb,var(--paper2),transparent 16%))}.donut{filter:drop-shadow(0 8px 15px #0002)}.preview-foot{background:var(--glass);backdrop-filter:blur(14px);border-color:var(--line);box-shadow:0 8px 24px #0003}.toast{border:1px solid #ffffff24;background:linear-gradient(110deg,#202b40,#152236);box-shadow:0 14px 35px #0006}.modal{backdrop-filter:blur(18px);background:color-mix(in srgb,var(--paper),transparent 2%);box-shadow:0 28px 90px #0008,inset 0 1px #ffffff12}

<body>
<div class="app">
<header class="top"><a class="brand" href="#" aria-label="raay home"><img src="raay-app-icon.png" alt="raay">raay</a><div class="top-center"><span class="preview-pill">Interactive design preview</span><span id="roleBadge" class="role-pill">Organization member</span></div><div class="top-right"><select id="roleSelect" class="role-select" aria-label="Switch preview role"><option value="member">Member workspace</option><option value="admin">Organization admin</option><option value="owner">Organization owner</option><option value="platform">Platform super admin</option></select><button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle light/dark">☾</button><button class="top-btn" id="profileButton">JD · Jordan Davis⌄</button></div></header>
<div class="layout"><aside class="sidebar"><div class="org-switch" id="orgSwitch"><span class="org-mark" id="orgMark">N</span><span class="org-copy"><b id="orgName">Northbridge University</b><small id="orgSub">Current organization</small></span><span class="chev">⌄</span></div><div class="nav-label" id="navLabel">Workspace</div><nav class="nav" id="sideNav"></nav><div class="sidebar-spacer"></div><div class="side-rule"></div><button class="nav-item" id="helpNav"><span class="ico">ⓘ</span>Help & support</button><div class="profile-mini"><span class="avatar" id="avatar">JD</span><span><b id="userName">Jordan Davis</b><small id="userRole">Member</small></span></div></aside><main class="main" id="main"><div id="pages"></div></main></div><nav class="mobile-nav" id="mobileNav"></nav>
</div><div class="preview-foot"><b>PREVIEW ONLY</b>Illustrative content · no live data or actions</div><div class="toast" id="toast" role="status" aria-live="polite"></div><div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal"></section></div>
<script>
const navSets={
 member:[['home','⌂','My elections'],['organizations','▦','Organizations'],['invitations','✉','Invitations'],['calendar','▦','Calendar'],['profile','○','Profile']],
 admin:[['overview','⌂','Overview'],['elections','▣','Elections'],['people','♙','People'],['activity','◷','Activity'],['departments','⌗','Departments'],['joining-codes','⌘','Joining codes'],['calendar','▦','Calendar'],['organizations','▦','Organizations'],['profile','○','Profile']],
 owner:[['overview','⌂','Overview'],['elections','▣','Elections'],['people','♙','People'],['activity','◷','Activity'],['departments','⌗','Departments'],['joining-codes','⌘','Joining codes'],['calendar','▦','Calendar'],['organizations','▦','Organizations'],['settings','⚙','Organization settings'],['billing','▤','Plans & billing'],['profile','○','Profile']],
 platform:[['platform-overview','⌂','Overview'],['platform-organizations','▦','Organizations'],['platform-admin','♜','Accounts & access'],['profile','○','Profile']]
};
const names={member:'Jordan Davis',admin:'Avery Morgan',owner:'Sarah Johnson',platform:'Alex Chen'};const initials={member:'JD',admin:'AM',owner:'SJ',platform:'AC'};const roleNames={member:'Member',admin:'Organization Admin',owner:'Organization Owner',platform:'Platform Super Admin'};
let role='member',currentPage='home',observerAccess=false,builderStep=0,showAllMemberEvents=false,extraChoices=0,activeOrg='Northbridge University';const sideNav=document.querySelector('#sideNav'),mobileNav=document.querySelector('#mobileNav'),pages=document.querySelector('#pages');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=document.querySelector('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function pickRole(value){role=value;currentPage=navSets[role][0][0];const platform=role==='platform';document.querySelector('#roleBadge').textContent=platform?'Platform administration':role==='owner'?'Owner workspace':role==='admin'?'Organization administration':'Organization member';document.querySelector('#orgSwitch').style.display=platform?'none':'flex';document.querySelector('#orgName').textContent=platform?'raay Platform':activeOrg;document.querySelector('#orgSub').textContent=platform?'Cross-organization console':'Current organization';document.querySelector('#orgMark').textContent=platform?'K':'N';document.querySelector('#userName').textContent=names[role];document.querySelector('#avatar').textContent=initials[role];document.querySelector('#userRole').textContent=roleNames[role];document.querySelector('#profileButton').textContent=initials[role]+' · '+names[role]+'⌄';render()}
function navButton(item,mobile=false){return `<button class="nav-item ${currentPage===item[0]?'active':''}" data-page="${item[0]}" ${mobile?'title="'+item[2]+'"':''}><span class="ico">${item[1]}</span>${item[2]}</button>`}
function openMore(){const overflow=[...getNavItems().slice(4),['help','ⓘ','Help & support']];document.querySelector('#modal').innerHTML='<h2>More pages</h2><p>Choose a page in your '+esc(roleNames[role].toLowerCase())+' workspace.</p><div class="setup-list">'+overflow.map(i=>`<button class="setup-step more-choice" data-more-page="${i[0]}"><span class="metric-icon">${i[1]}</span><b>${i[2]}</b>　›</button>`).join('')+'</div><div class="modal-actions"><button class="btn" data-close>Close</button></div>';document.querySelector('#modalBackdrop').classList.add('show');document.querySelector('[data-close]').onclick=closeModal;document.querySelectorAll('[data-more-page]').forEach(b=>b.onclick=()=>{const page=b.dataset.morePage;closeModal();go(page)})}
function getNavItems(){const items=[...navSets[role]];if(role!=='platform'&&observerAccess)items.push(['observer','◉','Observer view']);return items}
function render(){const roleItems=getNavItems();sideNav.innerHTML=roleItems.map(i=>navButton(i)).join('');const navItems=[...roleItems,['help','ⓘ','Help & support']],mobileItems=navItems.slice(0,4),overflow=navItems.slice(4);mobileNav.innerHTML=mobileItems.map(i=>navButton(i,true)).join('')+(overflow.length?'<button class="nav-item" data-more title="More pages"><span class="ico">⋯</span>More</button>':navItems.slice(4).map(i=>navButton(i,true)).join(''));const sharedPages=['event-detail','ballot','results','receipt','verify-receipt','transparency'];const rolePages=role==='member'?['join','scan','create-organization','invitation-detail',...sharedPages]:role==='platform'?[]:['create-organization','invitation-detail','event-builder','monitor','command-center','department-detail','results-announcement','publish-results',...sharedPages];const allowed=new Set([...roleItems.map(i=>i[0]),...rolePages]);if(!allowed.has(currentPage))currentPage=roleItems[0][0];pages.innerHTML=pageMarkup(currentPage);document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));const moreBtn=mobileNav.querySelector('[data-more]');if(moreBtn)moreBtn.onclick=openMore;bindPageActions()}
function go(id){currentPage=id;render();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
const electionRows=[['Student Council Election 2026','Student Council · Candidate election','Active','Apr 18 – Apr 22'],['Campus Sustainability Poll','University-wide · Single choice','Scheduled','May 02 – May 05'],['Residence Hall Representatives','Northbridge Housing · Candidate election','Draft','Not scheduled'],['Library Hours Survey','Student Services · Poll','Closed','Mar 10 – Mar 12']];
function pageMarkup(id){const platform=role==='platform';const org=platform?'Platform':role==='owner'?'Northbridge University':'Northbridge University';let title='',desc='',crumb='Workspace',actions='',body='';
if(id==='home'||id==='overview'||id==='platform-overview'){title=platform?'Platform overview':id==='overview'?'Organization overview':'My elections';desc=platform?'Review platform organizations and account access. Platform access does not grant tenant membership.':role==='member'?'Your eligible elections, polls, and recent participation.':`A clear view of ${org} activity and the actions that need attention.`;crumb=platform?'Platform':'Workspace';actions=role==='member'?'<button class="btn soft" data-go="organizations">Browse organizations</button>':platform?'<button class="btn" data-go="platform-organizations">Review organizations</button>':'<button class="btn primary" data-go="event-builder">＋ Create election</button>';body=platform?platformOverview():role==='member'?memberHome():orgOverview();}
else if(id==='elections'){title='Elections';desc='Create and manage elections and polls for this organization.';crumb='Organization / Elections';actions='<button class="btn" data-go="command-center">Live command center</button><button class="btn primary" data-go="event-builder">＋ Create election</button>';body=electionsPage()}
else if(id==='event-detail'){title='Student Council Election 2026';desc='Election details, eligibility, schedule, and the ballot entry point.';crumb='Elections / Details';actions='<span class="status">Active</span>'+(role==='member'?'':'<button class="btn" data-go="results-announcement">Review results</button>');body=eventDetailPage()}
else if(id==='ballot'){title='Student Council Election 2026';desc='Cast your ballot while voting is open.';crumb='My elections / Ballot';actions='<span class="status">Active</span>';body=ballotPage()}
else if(id==='results-announcement'){title='Review and announce results';desc='Review final totals and choose who can see them.';crumb='Elections / Results';body=resultsAnnouncementPage()} else if(id==='publish-results'){title='Publish election results';desc='Confirm the organization result announcement.';crumb='Elections / Publish results';body=publishResultsPage()} else if(id==='monitor'){title='Live election monitor';desc='Follow participation and election status while voting is open.';crumb='Elections / Monitor';actions='<span class="status">Live</span>';body=monitorPage()}
else if(id==='command-center'){title='Election command center';desc='A focused view of live elections and the actions available to administrators.';crumb='Organization / Command center';actions='<button class="btn" data-go="elections">All elections</button>';body=commandCenterPage()}
else if(id==='event-builder'){title='Create election';desc='Set up an election in clear, reviewable steps.';crumb='Elections / New election';body=eventBuilderPage()}
else if(id==='department-detail'){title='Computer Science';desc='Review department members and organization assignments.';crumb='Departments / Computer Science';actions='<button class="btn" data-go="departments">All departments</button>';body=departmentDetailPage()}
else if(id==='scan'){title='Scan an organization code';desc='Use an organization QR code or enter its joining code.';crumb='Organizations / Scan code';body=scanPage()}
else if(id==='receipt'){title='Vote receipt';desc='A receipt can confirm that a ballot was recorded without showing the selected choice.';crumb='My elections / Receipt';actions='<button class="btn" data-go="verify-receipt">Verify receipt</button>';body=receiptPage()}
else if(id==='verify-receipt'){title='Verify a receipt';desc='Check that a receipt exists in the public election record.';crumb='Transparency / Receipt verification';body=verifyReceiptPage()}
else if(id==='transparency'){title='Transparency center';desc='Learn how election records and receipt verification work.';crumb='Public information / Transparency';body=transparencyPage()}
else if(id==='results'){title='Election results';desc='Results are shown according to the election’s publication settings.';crumb='My elections / Results';body=resultsPage()}
else if(id==='people'){title='People';desc='Manage organization members, invitations, and access roles.';crumb='Organization / People';actions='<button class="btn primary" data-modal="invite">＋ Invite member</button>';body=peoplePage()}
else if(id==='departments'){title='Departments';desc='Organize members into departments and review their assignments.';crumb='Organization / Departments';actions='<button class="btn primary" data-modal="department">＋ Create department</button>';body=departmentsPage()}
else if(id==='activity'){title=role==='member'?'Invitations':'Activity';desc=role==='member'?'Review invitations and requests to join organizations.':'Review organization audit history and recent administrative activity.';crumb='Organization / '+title;body=role==='member'?invitationsPage():activityPage()}
else if(id==='invitation-detail'){title='Organization invitation';desc='Review the organization and membership role before responding.';crumb='Invitations / Review';body=invitationDetailPage()}
else if(id==='create-organization'){title='Create an organization';desc='Set up a new space for your community.';crumb='Organizations / Create';body=createOrganizationPage()}
else if(id==='invitations'){title='Invitations';desc='Review invitations and requests to join organizations.';crumb='My workspace / Invitations';body=invitationsPage()}
else if(id==='organizations'){title='Organizations';desc=role==='member'?'Your memberships and invitations to join other communities.':'Organizations you belong to and the role you hold in each.';crumb='My workspace / Organizations';actions='<button class="btn" data-go="create-organization">＋ Create organization</button><button class="btn primary" data-go="join">Join organization</button>';body=organizationsPage()}
else if(id==='join'){title='Join an organization';desc='Enter a joining code shared by an organization owner.';crumb='Organizations / Join';body=joinPage()}
else if(id==='calendar'){title='Election calendar';desc='Upcoming voting windows and scheduled organization events.';crumb='Workspace / Calendar';body=calendarPage()}
else if(id==='observer'){title='Observer view';desc='Follow public election progress without casting a ballot.';crumb='Workspace / Observer';body=observerPage()}
else if(id==='joining-codes'){title='Joining codes';desc='Create and revoke codes that let people request membership.';crumb='Organization / Joining codes';actions='<button class="btn primary" data-modal="code">＋ Create joining code</button>';body=joiningCodesPage()}
else if(id==='settings'){title='Organization settings';desc='Manage organization identity and presentation.';crumb='Organization / Settings';actions='<button class="btn primary" data-action="save">Save changes</button>';body=settingsPage()}
else if(id==='billing'){title='Plans & billing';desc='Review available plans and organization billing details.';crumb='Organization / Plans';body=billingPage()}
else if(id==='platform-organizations'){title='Organizations';desc='Review organization status and take permitted platform moderation actions.';crumb='Platform / Organizations';actions='<button class="btn" data-action="refresh">↻ Refresh</button>';body=platformOrganizations()}
else if(id==='platform-admin'){title='Platform administration';desc='Review platform metrics and manage platform administrator grants.';crumb='Platform / Accounts & access';actions='<button class="btn primary" data-modal="grant">＋ Grant admin access</button>';body=platformAccounts()}
else if(id==='profile'){title='My profile';desc='Manage your personal details and sign-in preferences.';crumb='Personal / Profile';body=accountPage()}
else {title='Help & support';desc='Find guidance for using raay.';crumb='Personal / Help';body=helpPage()}
return `<div class="page-head"><div><div class="crumb">${crumb}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${actions}</div></div>${body}`}
function metric(label,value,icon,foot){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon}</span></div><strong>${value}</strong><small>${foot}</small></article>`}
function electionCard(row,member=false){let status=row[2].toLowerCase(),target=member?(row[2]==='Active'?'ballot':row[2]==='Closed'?'results':'event-detail'):(row[2]==='Active'?'monitor':row[2]==='Draft'?'event-builder':'event-detail');return `<div class="list-row"><span class="metric-icon">▣</span><div class="row-main"><b>${row[0]}</b><small>${row[1]}</small></div><span class="status ${status}">${row[2]}</span><div class="row-end"><span class="date">${row[3]}</span><button class="btn small ${member&&row[2]==='Active'?'primary':''}" data-go="${target}">${member?(row[2]==='Active'?'Vote':row[2]==='Closed'?'Results':'View'):(row[2]==='Draft'?'Continue setup':'Open')}</button></div></div>`}

function bindPageActions(){document.querySelectorAll('[data-profile-photo]').forEach(input=>input.onchange=()=>{const file=input.files&&input.files[0],card=input.closest('.card');if(!file||!card)return;if(!file.type.startsWith('image/')){toast('Choose an image file.');return}let preview=card.querySelector('#profilePhotoPreview');if(!preview){preview=document.createElement('img');preview.id='profilePhotoPreview';preview.alt='Profile photo preview';preview.style='width:76px;height:76px;object-fit:cover;border-radius:50%;display:block;margin:10px 0';input.insertAdjacentElement('afterend',preview)}preview.src=URL.createObjectURL(file)});document.querySelectorAll('[data-qr-image]').forEach(input=>input.onchange=async()=>{const file=input.files?.[0];if(!file)return;if(!('BarcodeDetector'in window)){const status=document.querySelector('#qrStatus');if(status)status.textContent='This browser cannot read QR images automatically. Enter the printed joining code below.';toast('QR image scanning is not supported in this browser.');return}try{const detector=new BarcodeDetector({formats:['qr_code']}),bitmap=await createImageBitmap(file),items=await detector.detect(bitmap);if(!items.length){toast('No QR code found in that image. Try another image or enter the code.');return}let code=items[0].rawValue;try{const url=new URL(code);code=url.searchParams.get('code')||url.searchParams.get('join')||url.pathname.split('/').filter(Boolean).pop()||code}catch{}const field=document.querySelector('#joinCode');if(field)field.value=code;const status=document.querySelector('#qrStatus');if(status)status.textContent='QR code read. Confirm the code and select Find organization.';field?.focus()}catch{toast('Could not read that QR image. Enter the code manually.')}});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-modal]').forEach(b=>b.onclick=()=>openModal(b.dataset.modal));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action,b));document.querySelectorAll('[data-search]').forEach(input=>input.oninput=()=>{const target=document.getElementById(input.dataset.search);if(!target)return;const q=input.value.toLowerCase();target.querySelectorAll('tr,.list-row').forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('#electionTable .list-row').forEach((row,i)=>{let f=b.dataset.filter;row.style.display=f==='all'||electionRows[i][2]===f?'':'none'})});document.querySelectorAll('[data-builder-step]').forEach(b=>b.onclick=()=>{builderStep=Number(b.dataset.builderStep);const panel=document.querySelector('#builderPanel');if(panel){panel.innerHTML=builderPanel();document.querySelectorAll('[data-builder-step]').forEach(x=>x.classList.toggle('active',Number(x.dataset.builderStep)===builderStep));bindPageActions()}});document.querySelectorAll('[data-status-filter]').forEach(s=>s.onchange=()=>{document.querySelectorAll('#electionTable .list-row').forEach((row,i)=>row.style.display=s.value==='all'||electionRows[i][2]===s.value?'':'none')});document.querySelectorAll('.toolbar select.filter[data-row-filter]').forEach(s=>s.onchange=()=>{const card=s.closest('.card'),raw=s.value.toLowerCase(),value=raw.replace(/^all\s+/,'').replace(/\s+status$/,''),rows=card?.querySelectorAll('tbody tr,.row-list>.list-row')||[];rows.forEach(row=>{const all=/^all|^any/.test(raw);const text=row.textContent.toLowerCase();const match=raw==='active'?text.includes('active')&&!text.includes('inactive'):text.includes(value);row.style.display=all||match?'':'none'})});document.querySelectorAll('.tabs .tab:not([data-filter])').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));toast(`${b.textContent.trim()} view · illustrative preview.`)})}
function action(a,b){if(a==='publish-results'){toast('Preview only — results were not published and members were not notified.');return}if(a==='review-org'||a==='revoke-row'||a==='grant-row'){const row=b?.closest('tr'),target=row?.cells?.[0]?.innerText?.trim()||'selected organization';const status=row?.cells?.[4]?.innerText?.trim()||'';const title=a==='review-org'?'Review organization':a==='revoke-row'?'Revoke platform access':'Grant platform access';const note=a==='review-org'?(status.toLowerCase().includes('pending')?'Pending organizations can be verified or rejected.':'Current status: '+status+'. Available changes follow platform moderation rules.'):'This preview will not grant or revoke access.';document.querySelector('#modal').innerHTML=`<h2>${title}</h2><p><b>${esc(target)}</b><br>${esc(note)}</p><div class="notice">Illustrative preview only. No platform permission or organization status will change.</div><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" data-action="preview-confirm">Continue</button></div>`;document.querySelector('#modalBackdrop').classList.add('show');document.querySelector('[data-close]').onclick=closeModal;document.querySelector('[data-action=preview-confirm]').onclick=()=>{closeModal();toast('Preview only — no access or organization status changed.')};return}if(a==='date-range'){openModal('date-range');return}if(a==='load-more'){const body=document.querySelector('#platformUsers tbody');if(body&&!body.dataset.more){body.dataset.more='true';body.insertAdjacentHTML('beforeend','<tr><td><div class="person"><span class="avatar">CP</span><span><b>Casey Park</b><small>casey.park@example.edu</small></span></div></td><td>Verified</td><td><span class="role-chip">Standard account</span></td><td>May 12, 2026</td><td><button class="btn small" data-action="grant-row">Grant access</button></td></tr>');bindPageActions();b.textContent='End of sample list';b.disabled=true;toast('Loaded one more illustrative account.')}return}if(a==='create-organization'){const name=document.querySelector('input[placeholder=\"e.g. Northbridge Student Council\"]')?.value.trim();if(!name){toast('Enter an organization name first.');return}toast('Preview only — organization was not created.');return}if(a==='accept-invite'||a==='decline-invite'){toast(a==='accept-invite'?'Preview only — invitation was not accepted.':'Preview only — invitation was not declined.');return}if(a==='find-org'&&currentPage==='scan'){const input=document.querySelector('#joinCode');if(input&&!input.value.trim()){toast('Enter the joining code first.');return}const result=document.querySelector('#joinResult');if(result)result.innerHTML='<div class="action-box"><span class="org-mark">N</span><span><b>Northbridge University</b><small>Academic institution · Membership requires approval</small><button class="btn small primary" data-action="request-membership">Request to join</button></span></div>';bindPageActions();return}if(a==='toggle-all-elections'){showAllMemberEvents=!showAllMemberEvents;pages.innerHTML=pageMarkup('home');bindPageActions();return}if(a==='profile'){go('profile');return}if(a==='receipt'){go('receipt');return}if(a==='switch-org'){activeOrg=b?.dataset.org||activeOrg;document.querySelector('#orgName').textContent=activeOrg;go(role==='member'?'home':'overview');toast('Opened '+activeOrg+' in this preview.');return}if(a==='builder-next'||a==='builder-prev'){builderStep=Math.max(0,Math.min(4,builderStep+(a==='builder-next'?1:-1)));pages.innerHTML=pageMarkup('event-builder');bindPageActions();return}if(a==='add-choice'){extraChoices++;pages.innerHTML=pageMarkup('event-builder');bindPageActions();return}if(a==='verify-receipt'){const v=document.querySelector('#verifyResult');if(v)v.innerHTML='<div class="action-box"><span class="action-icon">ⓘ</span><span><b>Offline preview</b><small>No live receipt record was queried.</small></span></div>';return}if(a==='find-org'){const code=document.querySelector('#joinCode')?.value.trim();if(!code){toast('Enter the joining code first.');return}const result=document.querySelector('#joinResult');result.innerHTML='<div class="action-box"><span class="org-mark">N</span><span><b>Northbridge University</b><small>Academic institution · Chicago, IL · Membership requires approval</small><button class="btn small primary" data-action="request-membership">Request to join</button></span></div>';bindPageActions();return}if(a==='request-membership'){toast('Preview only — no membership request was sent.');return}if(a==='toggle-observer'){observerAccess=!observerAccess;render();toast(observerAccess?'Observer page added to this role preview.':'Observer page hidden from this role preview.');return}const messages={'save':'Preview only — changes are not saved.','refresh':'Illustrative data refreshed.','download':'Export is not connected in this preview.','profile':'Opening your profile.','department':'Department detail preview.','add-members':'Add members flow preview.','accept':'Invitation review is available in this preview.','switch-org':'Opening the selected organization.','scan':'Camera access is not enabled in this standalone preview.','find-org':'Enter a valid code in the real app to find an organization.','submit-ballot':'Preview only — no ballot was submitted.','receipt':'Receipt view preview — no live receipt exists.','observe':'Observer details preview.','month-back':'Calendar month changed in preview.','month-next':'Calendar month changed in preview.','copy-code':'Joining code copied in this preview.','revoke-code':'Preview only — joining code was not revoked.','upload-logo':'File upload is disabled in this standalone preview.','billing':'Plan comparison preview only.','grant-row':'Use Grant admin access to preview the confirmation.','revoke-row':'Use Revoke access to preview the confirmation.','support':'Support submission is not connected to a live service.','load-more':'This preview shows a sample first page; real account lists paginate from the server.','filter-active':'Showing all elections in this preview.','date-range':'Date range filter preview opened.','monitor-refresh':'Illustrative monitor values refreshed.','monitor-close':'Preview only — the real election was not closed.','copy-receipt':'Sample receipt ID copied.','department':'Department detail preview.','builder-next':'Builder step advanced.','builder-prev':'Builder step moved back.','builder-publish':'Preview only — election was not created or published.'};if(a==='copy-code'&&navigator.clipboard)navigator.clipboard.writeText('NBU-7H3K').catch(()=>{});if(a==='submit-ballot'){const c=document.querySelector('[name=candidate]:checked');if(!c){note('Choose a candidate first.');return}sessionStorage.setItem('raay-demo-choice',c.value);go('receipt');return}toast(messages[a]||'This interaction is a visual preview.')}
